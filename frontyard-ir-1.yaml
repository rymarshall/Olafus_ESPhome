esphome:
  name: frontyard-ir-1
  friendly_name: Frontyard IR 1
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


remote_transmitter:
  - pin: GPIO33
    id: ir_light1
    carrier_duty_percent: 50%
  - pin: GPIO32
    id: ir_light2
    carrier_duty_percent: 50%

button:
  - {platform: template, name: "Light 1 Power", on_press: [{remote_transmitter.transmit_nec: {transmitter_id: ir_light1, address: 0xFF00, command: 0xBF40}}]}
